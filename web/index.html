<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reelix &middot; Short-form video, shared</title>
    <meta
      name="description"
      content="Reelix is a cloud-native short-form video sharing service built for COM769 Scalable Advanced Software Solutions."
    />
    <meta name="theme-color" content="#0f0f11" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230f0f11'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23d8412a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="assets/css/reelix.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="masthead">
      <div class="masthead-inner">
        <a class="wordmark" href="#/" aria-label="Reelix home">
          <b>Reel</b><i>ix</i>
        </a>

        <nav class="nav" aria-label="Primary">
          <a class="nav-item" href="#/" data-nav="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M3 5h18M3 12h18M3 19h11" stroke-linecap="round" />
            </svg>
            Dashboard
          </a>
          <a class="nav-item" href="#/discover" data-nav="/discover">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="M16 16l4.5 4.5" stroke-linecap="round" />
            </svg>
            Discover
          </a>
          <a class="nav-item" href="#/studio" data-nav="/studio" data-role="creator" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M12 16V5m0 0L7.5 9.5M12 5l4.5 4.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M4 17v2.5h16V17" stroke-linecap="round" />
            </svg>
            Studio
          </a>
          <a class="nav-item" href="#/account" data-nav="/account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="8.5" r="3.5" />
              <path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke-linecap="round" />
            </svg>
            Account
          </a>
        </nav>

        <form class="searchbar" id="searchForm" role="search">
          <label class="sr-only" for="searchInput">Search clips</label>
          <input
            id="searchInput"
            name="q"
            type="search"
            placeholder="Search titles, publishers, producers"
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </form>

        <div class="session" id="sessionArea">
          <a class="btn btn-ghost" href="#/account">Sign in</a>
          <a class="btn btn-primary" href="#/account?tab=join">Join</a>
        </div>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1">
      <div class="loading">Loading&hellip;</div>
    </main>

    <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
